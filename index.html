  <body>
    <main class="calculator" id="calculator">
      <input type="text" id="result" class="result" readonly />

      <section class="control-row">
        <button data-clear>C</button>
        <button data-delete>←</button>
      </section>

      <section class="buttons">
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="/">÷</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="*">×</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="-">−</button>

        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button data-value="+">+</button>
        <button data-equals>=</button>
      </section>
    </main>

    <footer class="footer">
      Una creación de <a href="https://nadia.dev" target="_blank">&lt;micazoyolli /&gt; ✨</a>
    </footer>

    <script type="module" src="/src/main.js"></script>
